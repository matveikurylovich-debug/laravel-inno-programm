services:
    order-service:
        image: order-service:local
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: order-service
        volumes:
            - .:/var/www/html
            - ./docker/php/zz-www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
        environment:
            KAFKA_BROKERS: kafka:9092
            ANALYTICS_RABBITMQ_URL: amqp://guest:guest@analytics-rabbitmq:5672/
            ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
        networks:
            - order
            - microservices-net
        depends_on:
            order-postgres:
                condition: service_healthy
            order-redis:
                condition: service_healthy

    order-postgres:
        image: postgres:16-alpine
        container_name: order-postgres
        ports:
            - '${FORWARD_DB_PORT:-5435}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-order_db}'
            POSTGRES_USER: '${DB_USERNAME:-order}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - order-pgsql:/var/lib/postgresql/data
        networks:
            - order
            - microservices-net
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -q -d ${DB_DATABASE:-order_db} -U ${DB_USERNAME:-order}']
            retries: 5
            timeout: 5s

    order-redis:
        image: redis:7-alpine
        container_name: order-redis
        ports:
            - '${FORWARD_REDIS_PORT:-6382}:6379'
        volumes:
            - order-redis:/data
        networks:
            - order
            - microservices-net
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 5
            timeout: 5s

    order-nginx:
        image: nginx:alpine
        container_name: order-nginx
        ports:
            - '${FORWARD_HTTP_PORT:-8088}:80'
            - '${FORWARD_HTTPS_PORT:-8444}:443'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/certs:/etc/nginx/certs:ro
        depends_on:
            - order-service
        networks:
            - order
            - microservices-net

    stripe-cli:
        image: stripe/stripe-cli:latest
        container_name: order-stripe-cli
        environment:
            STRIPE_API_KEY: ${STRIPE_API_KEY:-${STRIPE_SECRET_KEY:-}}
        command:
            - listen
            - --forward-to
            - https://order-nginx/webhooks/stripe
            - --skip-verify
        depends_on:
            - order-nginx
        networks:
            - order
        restart: unless-stopped

    order-outbox-relay:
        image: order-service:local
        container_name: order-outbox-relay
        restart: unless-stopped
        command: php artisan order:outbox-relay
        environment:
            KAFKA_BROKERS: kafka:9092
            ANALYTICS_RABBITMQ_URL: amqp://guest:guest@analytics-rabbitmq:5672/
            ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
        volumes:
            - .:/var/www/html
        networks:
            - order
            - microservices-net
        depends_on:
            order-service:
                condition: service_started
            order-postgres:
                condition: service_healthy
            order-redis:
                condition: service_healthy

    order-catalog-consumer:
        image: order-service:local
        container_name: order-catalog-consumer
        restart: unless-stopped
        command: php artisan kafka:consume-catalog
        environment:
            KAFKA_BROKERS: kafka:9092
        volumes:
            - .:/var/www/html
        networks:
            - order
            - microservices-net
        depends_on:
            order-service:
                condition: service_started
            order-postgres:
                condition: service_healthy

    order-inventory-consumer:
        image: order-service:local
        container_name: order-inventory-consumer
        restart: unless-stopped
        command: php artisan kafka:consume-inventory
        environment:
            KAFKA_BROKERS: kafka:9092
        volumes:
            - .:/var/www/html
        networks:
            - order
            - microservices-net
        depends_on:
            order-service:
                condition: service_started
            order-postgres:
                condition: service_healthy
    order-grafana:
        image: grafana/grafana:latest
        container_name: order_grafana
        ports:
            - "3001:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_SERVER_PROTOCOL: http
            GF_SERVER_ROOT_URL: http://localhost:3001
            GF_SECURITY_COOKIE_SECURE: "false"
            GF_AUTH_ANONYMOUS_ENABLED: "true"
            GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/orders.json
            ORDER_DB_HOST: order-postgres:5432
            ORDER_DB_NAME: ${DB_DATABASE:-order_db}
            ORDER_DB_USER: ${DB_USERNAME:-order}
            ORDER_DB_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
        depends_on:
            order-postgres:
                condition: service_healthy
        networks:
            - order
            - microservices-net

networks:
    order:
        driver: bridge
    microservices-net:
        external: true

volumes:
    order-pgsql:
    order-redis:
