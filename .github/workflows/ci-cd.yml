name: Platform CI and stage deployment
on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'chore/**', 'refactor/**', 'security/**']
  pull_request:
    branches: [master, feat/jwt-frontend]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  IMAGE_REGISTRY: ghcr.io/matveikurylovich-debug
  IMAGE_TAG: ${{ github.sha }}
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Detect secrets in git history
        run: gitleaks detect --source . --log-opts=--all --config .gitleaks.toml --redact
  php-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_SECRET: ci-only-app-secret
      JWT_ACCESS_SECRET: ci-only-access-key-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-key-at-least-32-characters
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, catalog-service, order-service, search-service, notification-service, recommendation-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, intl, pdo_pgsql, pdo_sqlite, bcmath, redis, mongodb, rdkafka, zip, gd
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: ${{ matrix.service }}
      - run: test -f .env.example && cp .env.example .env || true
      - run: composer validate --strict --no-check-publish
      - run: ../scripts/ci/audit-high.sh
      - run: composer lint
      - run: composer refactor
      - run: composer analyse
  php-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, catalog-service, order-service, search-service, notification-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://127.0.0.1:27017
      JWT_ACCESS_SECRET: ci-only-access-key-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-key-at-least-32-characters
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, intl, pdo_pgsql, pdo_sqlite, bcmath, redis, mongodb, rdkafka, zip, gd
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: ${{ matrix.service }}
      - run: composer test
      - name: PostgreSQL integration group
        if: matrix.service == 'order-service'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing
        run: composer test -- --group=pgsql
  recommendation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: recommendation_test
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: recommendation-service
    env:
      APP_ENV: test
      APP_SECRET: ci-only-app-secret
      DATABASE_URL: postgresql://testing:testing@127.0.0.1:5432/recommendation_test?serverVersion=16
      JWT_JWKS_PATH: ../packages/platform-kit/tests/fixtures/jwks.json
      JWT_ISSUER: http://auth-app
      JWT_AUDIENCE: ecommerce
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, rdkafka
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: recommendation-service
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: php bin/phpunit
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analytics-service/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: analytics-service/backend/go.mod
          cache-dependency-path: analytics-service/backend/go.sum
      - run: go vet ./...
      - run: go test -race ./...
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Hadolint
        run: |
          curl -sSLf -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          find . \( -name Dockerfile -o -name 'Dockerfile.*' \) -not -path '*/vendor/*' -print0 \
            | xargs -0 hadolint --failure-threshold error
      - name: Build images
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            ./scripts/ci/build-images.sh --push
          else
            ./scripts/ci/build-images.sh
          fi
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: images
    env:
      COMPOSE_FILE: compose.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Boot and curl the gateway
        run: ./scripts/ci/smoke.sh
      - name: Save compose logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [secrets, php-quality, php-tests, recommendation, go, frontend, images, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: stage
    concurrency: stage-deploy
    steps:
      - uses: actions/checkout@v4
      # The private key lives only in the stage environment. On the server it
      # should be restricted with from= and, where sshd allows it, command=.
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_stage
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_stage ~/.ssh/known_hosts
      - name: Publish compose files and roll the stage tag
        env:
          STAGE_USER: ${{ secrets.STAGE_USER }}
          STAGE_IP: ${{ secrets.STAGE_IP }}
        run: |
          ssh -i ~/.ssh/id_stage -o StrictHostKeyChecking=yes "$STAGE_USER@$STAGE_IP" 'mkdir -p ~/app/infra/gateway ~/app/scripts/deploy'
          scp -i ~/.ssh/id_stage -o StrictHostKeyChecking=yes \
            compose.yaml "$STAGE_USER@$STAGE_IP:~/app/compose.yaml"
          scp -i ~/.ssh/id_stage -o StrictHostKeyChecking=yes \
            infra/gateway/default.conf infra/gateway/auth.conf \
            "$STAGE_USER@$STAGE_IP:~/app/infra/gateway/"
          scp -i ~/.ssh/id_stage -o StrictHostKeyChecking=yes \
            scripts/deploy/stage-remote.sh "$STAGE_USER@$STAGE_IP:~/app/scripts/deploy/stage-remote.sh"
          ssh -i ~/.ssh/id_stage -o StrictHostKeyChecking=yes "$STAGE_USER@$STAGE_IP" \
            "chmod +x ~/app/scripts/deploy/stage-remote.sh && COMPOSE_FILE=compose.yaml ~/app/scripts/deploy/stage-remote.sh ${{ github.sha }}"
