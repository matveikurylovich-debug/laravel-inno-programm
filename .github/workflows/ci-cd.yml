name: Platform CI and stage deployment
on:
  push:
    branches: [main, develop, 'feature/**', 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./start.sh --prepare-env
      - run: docker compose config --quiet && bash -n start.sh stop.sh
      - name: Reject committed secrets
        run: |
          set -euo pipefail
          bad=()
          while IFS= read -r -d '' name; do
            [[ -z "$name" || ! -f "$name" ]] && continue
            [[ "$name" == *.lock || "$name" == *composer.lock || "$name" == *package-lock.json || "$name" == */public/* ]] && continue
            base="${name##*/}"
            if [[ "$base" == .secrets ]]; then
              bad+=("$name")
            fi
            # `--` обязательно: шаблон начинается с дефисов, и без него grep
            # принимает -----BEGIN за неизвестную опцию и выходит с кодом 2.
            if grep -qE -- '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----' "$name"; then
              bad+=("$name")
            fi
            if [[ "$base" == .env || "$base" == .env.dev || "$base" == .env.example ]]; then
              if grep -qE -- '^(JWT_ACCESS_SECRET|JWT_REFRESH_SECRET|APP_SECRET|GEMINI_API_KEY)=.+' "$name"; then
                bad+=("$name")
              fi
            fi
          done < <(git ls-files -z)
          if ((${#bad[@]})); then
            printf 'Secrets found in: %s\n' "$(printf '%s\n' "${bad[@]}" | sort -u | paste -sd ', ' -)"
            exit 1
          fi
          echo 'No committed application secrets or SSH private keys found.'
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, catalog-service, order-service, search-service, notification-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports: ['5432:5432']
        options: --health-cmd='pg_isready -U testing' --health-interval=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: testing
      DB_PASSWORD: testing
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://127.0.0.1:27017
      JWT_ACCESS_SECRET: ci-only-access-key-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-key-at-least-32-characters
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, intl, pdo_pgsql, pdo_sqlite, bcmath, redis, mongodb, rdkafka, zip, gd
          tools: composer:v2
          coverage: none
      - run: cp .env.example .env && composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: |
          if [ -x vendor/bin/pest ]; then vendor/bin/pest; else vendor/bin/phpunit; fi
  recommendation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: recommendation_test
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports: ['5432:5432']
        options: --health-cmd='pg_isready -U testing' --health-interval=5s --health-retries=20
    defaults:
      run:
        working-directory: recommendation-service
    env:
      APP_ENV: test
      APP_SECRET: ci-only-app-secret
      DATABASE_URL: postgresql://testing:testing@127.0.0.1:5432/recommendation?serverVersion=16
      JWT_ACCESS_SECRET: ci-only-access-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, rdkafka
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: php bin/console lint:container
      - run: php bin/phpunit
  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: analytics-service/backend/go.mod
          cache-dependency-path: analytics-service/backend/go.sum
      - run: go vet ./...
      - run: go test -race ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  # Выключен, пока утёкший ключ stage не отозван и история с ним не вычищена.
  deploy:
    runs-on: ubuntu-latest
    needs: [configuration, php, recommendation, analytics, frontend]
    if: false
    environment: stage
    concurrency: stage-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_stage
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_stage ~/.ssh/known_hosts
      - name: Deploy code without overwriting runtime data and secrets
        env:
          STAGE_USER: ${{ secrets.STAGE_USER }}
          STAGE_IP: ${{ secrets.STAGE_IP }}
        run: |
          rsync -az --delete --exclude .git --exclude node_modules --exclude vendor \
            --include '/recommendation-service/.env' \
            --exclude .env --exclude '.env.local' --exclude '.env.*.local' --exclude .secrets \
            --exclude storage --exclude var --exclude infra/certs --exclude .local \
            -e 'ssh -i ~/.ssh/id_stage -o StrictHostKeyChecking=yes' ./ "$STAGE_USER@$STAGE_IP:~/app/"
          ssh -i ~/.ssh/id_stage -o StrictHostKeyChecking=yes "$STAGE_USER@$STAGE_IP" 'cd ~/app && START_ENV=stage ./start.sh'
