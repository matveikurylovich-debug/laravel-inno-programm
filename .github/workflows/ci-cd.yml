name: Platform CI and stage deployment
on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'chore/**', 'refactor/**', 'security/**']
  pull_request:
    branches: [master, feat/jwt-frontend]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./start.sh --prepare-env
      - run: docker compose config --quiet && bash -n start.sh stop.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Detect secrets in git history
        run: gitleaks detect --source . --log-opts=--all --config .gitleaks.toml --redact
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, catalog-service, order-service, search-service, notification-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: testing
      DB_PASSWORD: testing
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://127.0.0.1:27017
      JWT_ACCESS_SECRET: ci-only-access-key-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-key-at-least-32-characters
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, intl, pdo_pgsql, pdo_sqlite, bcmath, redis, mongodb, rdkafka, zip, gd
          tools: composer:v2
          coverage: none
      - run: cp .env.example .env && composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: |
          if [ -x vendor/bin/pest ]; then vendor/bin/pest; else vendor/bin/phpunit; fi
  recommendation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: recommendation_test
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: recommendation-service
    env:
      APP_ENV: test
      APP_SECRET: ci-only-app-secret
      DATABASE_URL: postgresql://testing:testing@127.0.0.1:5432/recommendation_test?serverVersion=16
      JWT_ACCESS_SECRET: ci-only-access-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, rdkafka
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: php bin/console lint:container
      - run: php bin/phpunit
  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: analytics-service/backend/go.mod
          cache-dependency-path: analytics-service/backend/go.sum
      - run: go vet ./...
      - run: go test -race ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  # TODO(PR-11): включить после нового ключа и нового процесса деплоя.
  deploy:
    runs-on: ubuntu-latest
    needs: [configuration, secrets, php, recommendation, analytics, frontend]
    if: false
    environment: stage
    concurrency: stage-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_stage
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_stage ~/.ssh/known_hosts
      - name: Deploy code without overwriting runtime data and secrets
        env:
          STAGE_USER: ${{ secrets.STAGE_USER }}
          STAGE_IP: ${{ secrets.STAGE_IP }}
        run: |
          rsync -az --delete --exclude .git --exclude node_modules --exclude vendor \
            --include '/recommendation-service/.env' \
            --exclude .env --exclude '.env.local' --exclude '.env.*.local' --exclude .secrets \
            --exclude storage --exclude var --exclude infra/certs --exclude .local \
            -e 'ssh -i ~/.ssh/id_stage -o StrictHostKeyChecking=yes' ./ "$STAGE_USER@$STAGE_IP:~/app/"
          ssh -i ~/.ssh/id_stage -o StrictHostKeyChecking=yes "$STAGE_USER@$STAGE_IP" 'cd ~/app && START_ENV=stage ./start.sh'
