name: CI/CD Production Pipeline

# Триггеры: пуш в любые ветки, открытие Pull Request в main, либо ручной запуск
on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. ЭТАП CI: синтаксис всего монорепо
  # ==========================================
  ci-syntax:
    name: PHP Syntax (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP Syntax across Microservices
        run: |
          echo "Запуск синтаксической проверки микросервисов..."
          find . -name "*.php" ! -path "*/vendor/*" -print0 | xargs -0 -n 1 -P 4 php -l

  # ==========================================
  # 2. ЭТАП CI: Pint, PHPStan, Pest / PHPUnit
  # ==========================================
  ci-test:
    name: ${{ matrix.service }} (Pint / PHPStan / Tests)
    runs-on: ubuntu-latest
    needs: [ci-syntax]
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - order-service
          - catalog-service
          - search-service
          - notification-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, bcmath, redis, mongodb, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ matrix.service }}/vendor
          key: composer-${{ matrix.service }}-${{ hashFiles(format('{0}/composer.lock', matrix.service)) }}
          restore-keys: |
            composer-${{ matrix.service }}-

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader
          php artisan key:generate --force

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis)
        if: hashFiles(format('{0}/phpstan.neon', matrix.service)) != '' || hashFiles(format('{0}/phpstan.neon.dist', matrix.service)) != ''
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Pest / PHPUnit
        run: |
          if [ -x vendor/bin/pest ]; then
            echo "Прогон Pest..."
            vendor/bin/pest --compact
          else
            echo "Прогон PHPUnit (php artisan test)..."
            php artisan test --compact
          fi

  # ==========================================
  # 3. ЭТАП CD: Доставка и развёртывание на Stage
  # ==========================================
  cd-deploy:
    name: Delivery to Stage VM (CD)
    runs-on: ubuntu-latest
    needs: [ci-syntax, ci-test]
    # Условие: деплоим только при пуше в main или ручном вызове, но не из PR и feature-веток
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_stage
          chmod 600 ~/.ssh/id_stage
          ssh-keyscan -H ${{ secrets.STAGE_IP }} >> ~/.ssh/known_hosts

      - name: Sync codebase via Rsync
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'vendor' \
            --exclude '.secrets' \
            -e "ssh -i ~/.ssh/id_stage -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.STAGE_USER }}@${{ secrets.STAGE_IP }}:~/app/

      - name: Orchestrate Containers on Stage
        run: |
          ssh -i ~/.ssh/id_stage ${{ secrets.STAGE_USER }}@${{ secrets.STAGE_IP }} "bash -c '
            cd ~/app
            chmod +x start.sh stop.sh 2>/dev/null || true
            ./stop.sh 2>/dev/null || true
            ./start.sh
          '"
