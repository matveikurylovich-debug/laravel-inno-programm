services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            # - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            MAIL_MAILER: smtp
            MAIL_HOST: mailhog
            MAIL_PORT: 1025
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - microservices-net
        depends_on:
            - mongodb
            - mailhog
    notification-worker:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: always
        command: php artisan kafka:consume-auth
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            MAIL_MAILER: smtp
            MAIL_HOST: mailhog
            MAIL_PORT: 1025
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - microservices-net
        depends_on:
            - mongodb
            - kafka
            - mailhog
    order-worker:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: always
        command: php artisan kafka:consume-orders
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            MAIL_MAILER: smtp
            MAIL_HOST: mailhog
            MAIL_PORT: 1025
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - microservices-net
        depends_on:
            - mongodb
            - kafka
            - mailhog
    mongodb:
        image: 'mongo:7.0'
        ports:
            - '${FORWARD_DB_PORT:-27017}:27017'
        environment:
            MONGO_INITDB_DATABASE: '${DB_DATABASE:-notification_service}'
        volumes:
            - 'sail-mongodb:/data/db'
        networks:
            - sail
            - microservices-net
        healthcheck:
            test:
                - CMD
                - mongosh
                - '--eval'
                - "db.adminCommand('ping')"
            retries: 3
            timeout: 5s
    kafka:
        image: 'apache/kafka:latest'
        container_name: notification_kafka
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        volumes:
            - 'sail-kafka:/var/lib/kafka/data'
        networks:
            - sail
            - microservices-net
    mailhog:
        image: 'mailhog/mailhog:latest'
        container_name: notification_mailhog
        ports:
            - '1025:1025'      # SMTP
            - '8025:8025'      # Web-панель писем
        networks:
            - sail

    nginx:
        image: 'nginx:alpine'
        container_name: notification_nginx
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
            - './docker/nginx/certs:/etc/nginx/certs:ro'
        depends_on:
            - laravel.test
        networks:
            - sail
networks:
    sail:
        driver: bridge
    microservices-net:
        external: true
volumes:
    sail-mongodb:
        driver: local
    sail-kafka:
        driver: local

        