services:
    catalog-postgres:
        image: postgres:16-alpine
        container_name: catalog-postgres
        ports:
            - '${FORWARD_DB_PORT:-5434}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-catalog_db}'
            POSTGRES_USER: '${DB_USERNAME:-catalog}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - catalog-pgsql:/var/lib/postgresql/data
        networks:
            - catalog
            - microservices-net
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -q -d ${DB_DATABASE:-catalog_db} -U ${DB_USERNAME:-catalog}']
            retries: 5
            timeout: 5s

    catalog-redis:
        image: redis:7-alpine
        container_name: catalog-redis
        ports:
            - '${FORWARD_REDIS_PORT:-6381}:6379'
        volumes:
            - catalog-redis:/data
        networks:
            - catalog
            - microservices-net
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 5
            timeout: 5s

    minio:
        build:
            context: ./docker/minio
            dockerfile: Dockerfile
        image: catalog-minio:local
        container_name: catalog-minio
        command: server /data --console-address ":9001"
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001'
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-minioadmin}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-minioadmin}'
        volumes:
            - catalog-minio:/data
        networks:
            - catalog
            - microservices-net
        healthcheck:
            test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9000/minio/health/live']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    minio-init:
        build:
            context: ./docker/minio
            dockerfile: Dockerfile.mc
        image: catalog-mc:local
        container_name: catalog-minio-init
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-minioadmin}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-minioadmin}'
        entrypoint:
            - /bin/sh
            - -c
            - |
                mc alias set myminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
                mc mb --ignore-existing myminio/catalog-images
                mc anonymous set download myminio/catalog-images
        networks:
            - catalog
            - microservices-net
        restart: 'no'

    catalog-service:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: catalog-service
        volumes:
            - .:/var/www/html
            - ./docker/php/zz-www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
        networks:
            - catalog
            - microservices-net
        depends_on:
            catalog-postgres:
                condition: service_healthy
            catalog-redis:
                condition: service_healthy
            minio:
                condition: service_started

    catalog-nginx:
        image: nginx:alpine
        container_name: catalog-nginx
        ports:
            - '${FORWARD_HTTPS_PORT:-8443}:443'
            - '127.0.0.1:${FORWARD_CATALOG_HTTP_PORT:-8084}:8080'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/certs:/etc/nginx/certs:ro
        depends_on:
            - catalog-service
        networks:
            - catalog
            - microservices-net

networks:
    catalog:
        driver: bridge
    microservices-net:
        external: true

volumes:
    catalog-pgsql:
    catalog-redis:
    catalog-minio:
