name: shop
services:
  php-base:
    profiles: ["php-base"]
    image: ecommerce-php-base:8.5
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    command: ["php", "-v"]
  auth-app:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-auth:${IMAGE_TAG:-local}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL:-https://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run ./start.sh}
      JWT_ISSUER: ${PUBLIC_URL:-https://localhost}
      KAFKA_BROKERS: kafka:9092
      ANALYTICS_RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@analytics-rabbitmq:5672/
      ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
      APP_KEY: ${AUTH_APP_KEY:?Run ./start.sh}
      DB_CONNECTION: pgsql
      DB_HOST: auth-postgres
      DB_PORT: '5432'
      DB_DATABASE: auth_db
      DB_USERNAME: auth
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set database password}
      REDIS_HOST: auth-redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: database
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      SESSION_SECURE_COOKIE: 'true'
      PHP_CLI_SERVER_WORKERS: '4'
      NOTIFICATION_SERVICE_URL: http://notification-app:80/api
      ANALYTICS_SERVICE_URL: http://analytics-back:8080/analytics
      SESSION_COOKIE: auth_session
    networks:
    - backend
    depends_on:
      auth-postgres:
        condition: service_started
      auth-redis:
        condition: service_started
      analytics-back:
        condition: service_healthy
    restart: unless-stopped
    env_file:
    - path: ./auth-service/.env
      required: false
    healthcheck:
      test:
      - CMD-SHELL
      - 'php -r "exit(is_file(''vendor/autoload.php'') ? 0 : 1);"'
      interval: 10s
      timeout: 5s
      retries: 12
  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set database password}
    volumes:
    - sail-pgsql:/var/lib/postgresql/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -q -d auth_db -U auth
      retries: 3
      timeout: 5s
    restart: unless-stopped
  auth-redis:
    image: redis:7-alpine
    volumes:
    - sail-redis:/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      retries: 3
      timeout: 5s
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
  catalog-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Set database password}
    volumes:
    - catalog-pgsql:/var/lib/postgresql/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -q -d catalog_db -U catalog
      retries: 5
      timeout: 5s
    restart: unless-stopped
  catalog-redis:
    image: redis:7-alpine
    volumes:
    - catalog-redis:/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      retries: 5
      timeout: 5s
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
  minio:
    build:
      context: ./catalog-service/docker/minio
      dockerfile: Dockerfile
    image: catalog-minio:local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD}
    volumes:
    - catalog-minio:/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
  minio-init:
    build:
      context: ./catalog-service/docker/minio
      dockerfile: Dockerfile.mc
    image: catalog-mc:local
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD}
    entrypoint:
    - /bin/sh
    - -c
    - 'mc alias set myminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"

      mc mb --ignore-existing myminio/catalog-images

      mc anonymous set download myminio/catalog-images

      '
    networks:
    - backend
    restart: 'no'
  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL:-https://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run ./start.sh}
      JWT_ISSUER: ${PUBLIC_URL:-https://localhost}
      ANALYTICS_RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@analytics-rabbitmq:5672/
      ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
      APP_KEY: ${CATALOG_APP_KEY:?Run ./start.sh}
      DB_CONNECTION: pgsql
      DB_HOST: catalog-postgres
      DB_PORT: '5432'
      DB_DATABASE: catalog_db
      DB_USERNAME: catalog
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set database password}
      REDIS_HOST: catalog-redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: database
      AUTH_SERVICE_URL: http://auth-nginx
      SESSION_COOKIE: catalog_session
      SESSION_SECURE_COOKIE: 'true'
      LOG_CHANNEL: stderr
      AWS_ACCESS_KEY_ID: app
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD}
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: ${PUBLIC_URL:-https://localhost}/media/catalog-images
      AWS_BUCKET: catalog-images
      AWS_USE_PATH_STYLE_ENDPOINT: 'true'
    networks:
    - backend
    depends_on:
      catalog-postgres:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-catalog:${IMAGE_TAG:-local}
    env_file:
    - path: ./catalog-service/.env
      required: false
    healthcheck:
      test:
      - CMD-SHELL
      - 'php -r "exit(is_file(''vendor/autoload.php'') ? 0 : 1);"'
      interval: 10s
      timeout: 5s
      retries: 12
  catalog-order-consumer:
    restart: unless-stopped
    command: php artisan kafka:consume-orders
    environment:
      KAFKA_BROKERS: kafka:9092
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL:-https://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run ./start.sh}
      JWT_ISSUER: ${PUBLIC_URL:-https://localhost}
      ANALYTICS_RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@analytics-rabbitmq:5672/
      ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
      APP_KEY: ${CATALOG_APP_KEY:?Run ./start.sh}
      DB_CONNECTION: pgsql
      DB_HOST: catalog-postgres
      DB_PORT: '5432'
      DB_DATABASE: catalog_db
      DB_USERNAME: catalog
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set database password}
      REDIS_HOST: catalog-redis
      CACHE_STORE: redis
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      AUTH_SERVICE_URL: http://auth-nginx
      SESSION_COOKIE: catalog_session
      SESSION_SECURE_COOKIE: 'true'
      AWS_ACCESS_KEY_ID: app
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD}
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: ${PUBLIC_URL:-https://localhost}/media/catalog-images
      AWS_BUCKET: catalog-images
      AWS_USE_PATH_STYLE_ENDPOINT: 'true'
    networks:
    - backend
    depends_on:
      catalog-postgres:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-catalog:${IMAGE_TAG:-local}
    env_file:
    - path: ./catalog-service/.env
      required: false
  catalog-nginx:
    image: nginx:alpine
    volumes:
    - ./catalog-service:/var/www/html:ro
    - ./catalog-service/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      catalog-service:
        condition: service_started
    networks:
    - backend
    restart: unless-stopped
  order-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-order:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      ANALYTICS_RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@analytics-rabbitmq:5672/
      ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL:-https://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run ./start.sh}
      JWT_ISSUER: ${PUBLIC_URL:-https://localhost}
      APP_KEY: ${ORDER_APP_KEY:?Run ./start.sh}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      DB_CONNECTION: pgsql
      DB_HOST: order-postgres
      DB_PORT: '5432'
      DB_DATABASE: order_db
      DB_USERNAME: order
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set database password}
      REDIS_HOST: order-redis
      CACHE_STORE: redis
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
    networks:
    - backend
    depends_on:
      order-postgres:
        condition: service_healthy
      order-redis:
        condition: service_healthy
    restart: unless-stopped
    env_file:
    - path: ./order-service/.env
      required: false
    healthcheck:
      test:
      - CMD-SHELL
      - 'php -r "exit(is_file(''vendor/autoload.php'') ? 0 : 1);"'
      interval: 10s
      timeout: 5s
      retries: 12
  order-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set database password}
    volumes:
    - order-pgsql:/var/lib/postgresql/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -q -d order_db -U order
      retries: 5
      timeout: 5s
    restart: unless-stopped
  order-redis:
    image: redis:7-alpine
    volumes:
    - order-redis:/data
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      retries: 5
      timeout: 5s
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
  order-nginx:
    image: nginx:alpine
    volumes:
    - ./order-service:/var/www/html:ro
    - ./order-service/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      order-service:
        condition: service_started
    networks:
    - backend
    restart: unless-stopped
  stripe-cli:
    image: stripe/stripe-cli:v1.27.0
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command:
    - listen
    - --events
    - payment_intent.succeeded,payment_intent.payment_failed
    - --forward-to
    - https://order-nginx/webhooks/stripe
    - --skip-verify
    - --print-secret
    depends_on:
      order-nginx:
        condition: service_started
    networks:
    - backend
    restart: unless-stopped
  order-outbox-relay:
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-order:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: php artisan order:outbox-relay
    environment:
      KAFKA_BROKERS: kafka:9092
      ANALYTICS_RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@analytics-rabbitmq:5672/
      ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL:-https://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run ./start.sh}
      JWT_ISSUER: ${PUBLIC_URL:-https://localhost}
      APP_KEY: ${ORDER_APP_KEY:?Run ./start.sh}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      DB_CONNECTION: pgsql
      DB_HOST: order-postgres
      DB_PORT: '5432'
      DB_DATABASE: order_db
      DB_USERNAME: order
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set database password}
      REDIS_HOST: order-redis
      CACHE_STORE: redis
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
    networks:
    - backend
    depends_on:
      order-service:
        condition: service_started
      order-postgres:
        condition: service_healthy
      order-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
    - path: ./order-service/.env
      required: false
  order-catalog-consumer:
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-order:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: php artisan kafka:consume-catalog
    environment:
      KAFKA_BROKERS: kafka:9092
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL:-https://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run ./start.sh}
      JWT_ISSUER: ${PUBLIC_URL:-https://localhost}
      ANALYTICS_RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@analytics-rabbitmq:5672/
      ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
      APP_KEY: ${ORDER_APP_KEY:?Run ./start.sh}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      DB_CONNECTION: pgsql
      DB_HOST: order-postgres
      DB_PORT: '5432'
      DB_DATABASE: order_db
      DB_USERNAME: order
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set database password}
      REDIS_HOST: order-redis
      CACHE_STORE: redis
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
    networks:
    - backend
    depends_on:
      order-service:
        condition: service_started
      order-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
    - path: ./order-service/.env
      required: false
  order-inventory-consumer:
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-order:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: php artisan kafka:consume-inventory
    environment:
      KAFKA_BROKERS: kafka:9092
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL:-https://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run ./start.sh}
      JWT_ISSUER: ${PUBLIC_URL:-https://localhost}
      ANALYTICS_RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@analytics-rabbitmq:5672/
      ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
      APP_KEY: ${ORDER_APP_KEY:?Run ./start.sh}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      DB_CONNECTION: pgsql
      DB_HOST: order-postgres
      DB_PORT: '5432'
      DB_DATABASE: order_db
      DB_USERNAME: order
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set database password}
      REDIS_HOST: order-redis
      CACHE_STORE: redis
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
    networks:
    - backend
    depends_on:
      order-service:
        condition: service_started
      order-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
    - path: ./order-service/.env
      required: false
  order-grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_PROTOCOL: http
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_SECURITY_COOKIE_SECURE: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/orders.json
      ORDER_DB_HOST: order-postgres:5432
      ORDER_DB_NAME: order_db
      ORDER_DB_USER: order
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set database password}
    volumes:
    - ./order-service/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./order-service/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      order-postgres:
        condition: service_healthy
    networks:
    - backend
    restart: unless-stopped
    profiles:
    - tools
  search-app:
    build:
      context: .
      dockerfile: search-service/Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-search:${IMAGE_TAG:-local}
    environment:
      KAFKA_BROKERS: kafka:9092
      ANALYTICS_RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@analytics-rabbitmq:5672/
      ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      REDIS_HOST: search-redis
      CACHE_STORE: redis
      SESSION_DRIVER: array
      DB_CONNECTION: 'null'
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL:-https://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run ./start.sh}
      JWT_ISSUER: ${PUBLIC_URL:-https://localhost}
      APP_KEY: ${SEARCH_APP_KEY:?Run ./start.sh}
      QUEUE_CONNECTION: redis
      QUEUE_FAILED_DRIVER: file
    networks:
    - backend
    depends_on:
      elasticsearch:
        condition: service_healthy
      search-redis:
        condition: service_healthy
    restart: unless-stopped
    env_file:
    - path: ./search-service/.env
      required: false
    healthcheck:
      test:
      - CMD-SHELL
      - 'php -r "exit(is_file(''vendor/autoload.php'') ? 0 : 1);"'
      interval: 10s
      timeout: 5s
      retries: 12
  search-catalog-consumer:
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-search:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: php artisan kafka:consume-catalog
    environment:
      KAFKA_BROKERS: kafka:9092
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      REDIS_HOST: search-redis
      CACHE_STORE: redis
      SESSION_DRIVER: array
      DB_CONNECTION: 'null'
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL:-https://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run ./start.sh}
      JWT_ISSUER: ${PUBLIC_URL:-https://localhost}
      ANALYTICS_RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@analytics-rabbitmq:5672/
      ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
      APP_KEY: ${SEARCH_APP_KEY:?Run ./start.sh}
      QUEUE_CONNECTION: redis
      QUEUE_FAILED_DRIVER: file
    networks:
    - backend
    depends_on:
      search-app:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
    - path: ./search-service/.env
      required: false
  search-stock-consumer:
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-search:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: php artisan kafka:consume-stock
    environment:
      KAFKA_BROKERS: kafka:9092
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      REDIS_HOST: search-redis
      CACHE_STORE: redis
      SESSION_DRIVER: array
      DB_CONNECTION: 'null'
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: 'false'
      APP_URL: ${PUBLIC_URL:-https://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-https://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run ./start.sh}
      JWT_ISSUER: ${PUBLIC_URL:-https://localhost}
      ANALYTICS_RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@analytics-rabbitmq:5672/
      ANALYTICS_RABBITMQ_EXCHANGE: analytics.events
      APP_KEY: ${SEARCH_APP_KEY:?Run ./start.sh}
      QUEUE_CONNECTION: redis
      QUEUE_FAILED_DRIVER: file
    networks:
    - backend
    depends_on:
      search-app:
        condition: service_started
