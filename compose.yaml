name: shop

x-php-env: &php-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: 'false'
  APP_URL: ${PUBLIC_URL:-https://localhost}
  FRONTEND_URL: ${FRONTEND_URL:-${PUBLIC_URL:-https://localhost}}
  APP_LOCALE: ru
  APP_FALLBACK_LOCALE: ru
  LOG_CHANNEL: stderr

x-jwt-verify-env: &jwt-verify-env
  JWT_JWKS_URL: http://auth-nginx/api/v1/internal/jwks
  JWT_AUDIENCE: ecommerce
  JWT_ISSUER: ${PUBLIC_URL:-https://localhost}

x-kafka-env: &kafka-env
  KAFKA_BROKERS: kafka:9092

x-analytics-env: &analytics-env
  ANALYTICS_RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Run ./start.sh}@analytics-rabbitmq:5672/
  ANALYTICS_RABBITMQ_EXCHANGE: analytics.events

x-fpm-healthcheck: &fpm-healthcheck
  test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

x-artisan-healthcheck: &artisan-healthcheck
  test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 20s

x-nginx-healthcheck: &nginx-healthcheck
  test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/up"]
  interval: 10s
  timeout: 5s
  retries: 6

x-redis: &redis-service
  image: redis:7-alpine
  restart: unless-stopped
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Run ./start.sh}
  command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Run ./start.sh}"]
  healthcheck:
    test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
    interval: 5s
    timeout: 5s
    retries: 10

x-php-service: &php-service
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512M

x-laravel-build-contexts: &laravel-contexts
  php-base: "docker-image://ecommerce-php-base:8.5"
  platform-kit: "./packages/platform-kit"

# ---------- auth ----------
x-auth-db-env: &auth-db-env
  <<: *php-env
  APP_KEY: ${AUTH_APP_KEY:?Run ./start.sh}
  DB_CONNECTION: pgsql
  DB_HOST: auth-postgres
  DB_PORT: '5432'
  DB_DATABASE: auth_db
  DB_USERNAME: auth
  DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run ./start.sh}
  REDIS_HOST: auth-redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Run ./start.sh}
  CACHE_STORE: redis
  QUEUE_CONNECTION: database

x-auth-worker: &auth-worker
  <<: *php-service
  image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-auth:${IMAGE_TAG:-local}
  env_file:
    - path: ./auth-service/.env
      required: false

# ---------- catalog ----------
x-catalog-env: &catalog-env
  <<: *php-env
  APP_KEY: ${CATALOG_APP_KEY:?Run ./start.sh}
  DB_CONNECTION: pgsql
  DB_HOST: catalog-postgres
  DB_PORT: '5432'
  DB_DATABASE: catalog_db
  DB_USERNAME: catalog
  DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Run ./start.sh}
  REDIS_HOST: catalog-redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Run ./start.sh}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: database
  SESSION_COOKIE: catalog_session
  SESSION_SECURE_COOKIE: 'true'
  FILESYSTEM_DISK: minio
  AWS_ACCESS_KEY_ID: app
  AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Run ./start.sh}
  AWS_ENDPOINT: http://minio:9000
  AWS_URL: ${PUBLIC_URL:-https://localhost}/media/catalog-images
  AWS_BUCKET: catalog-images
  AWS_USE_PATH_STYLE_ENDPOINT: 'true'

x-catalog-worker: &catalog-worker
  <<: *php-service
  image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-catalog:${IMAGE_TAG:-local}
  env_file:
    - path: ./catalog-service/.env
      required: false

# ---------- order ----------
x-order-env: &order-env
  <<: *php-env
  APP_KEY: ${ORDER_APP_KEY:?Run ./start.sh}
  DB_CONNECTION: pgsql
  DB_HOST: order-postgres
  DB_PORT: '5432'
  DB_DATABASE: order_db
  DB_USERNAME: order
  DB_PASSWORD: ${ORDER_DB_PASSWORD:?Run ./start.sh}
  REDIS_HOST: order-redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Run ./start.sh}
  CACHE_STORE: redis
  SESSION_DRIVER: array
  QUEUE_CONNECTION: database
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  ORDER_PAYMENT_TTL_MINUTES: ${ORDER_PAYMENT_TTL_MINUTES:-30}
  ORDER_RESERVE_TIMEOUT_MINUTES: ${ORDER_RESERVE_TIMEOUT_MINUTES:-5}

x-order-worker: &order-worker
  <<: *php-service
  image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-order:${IMAGE_TAG:-local}
  env_file:
    - path: ./order-service/.env
      required: false

# ---------- search ----------
x-search-env: &search-env
  <<: [*php-env, *jwt-verify-env]
  APP_KEY: ${SEARCH_APP_KEY:?Run ./start.sh}
  DB_CONNECTION: 'null'
  SESSION_DRIVER: array
  ELASTICSEARCH_HOSTS: http://elasticsearch:9200
  REDIS_HOST: search-redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Run ./start.sh}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  QUEUE_FAILED_DRIVER: file

x-search-worker: &search-worker
  <<: *php-service
  image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-search:${IMAGE_TAG:-local}
  env_file:
    - path: ./search-service/.env
      required: false

# ---------- notification ----------
x-notification-env: &notification-env
  <<: *php-env
  APP_KEY: ${NOTIFICATION_APP_KEY:?Run ./start.sh}
  LOG_LEVEL: info
  DB_CONNECTION: mongodb
  MONGODB_URI: mongodb://root:${MONGO_PASSWORD:?Run ./start.sh}@mongodb:27017/?authSource=admin
  MONGODB_DATABASE: notification_service
  SESSION_DRIVER: array
  CACHE_STORE: mongodb
  KAFKA_CACHE_DRIVER: mongodb
  BROADCAST_CONNECTION: 'null'
  MAIL_MAILER: smtp
  MAIL_HOST: ${MAIL_HOST:-mailpit}
  MAIL_PORT: ${MAIL_PORT:-1025}

x-notification-worker: &notification-worker
  <<: *php-service
  image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-notification:${IMAGE_TAG:-local}
  env_file:
    - path: ./notification-service/.env
      required: false

# ---------- recommendation ----------
x-recommendation-env: &recommendation-env
  APP_ENV: prod
  APP_DEBUG: 'false'
  APP_SECRET: ${RECOMMENDATION_APP_SECRET:?Run ./start.sh}
  DEFAULT_URI: ${PUBLIC_URL:-https://localhost}
  DATABASE_URL: postgresql://app_user:${RECOMMENDATION_DB_PASSWORD:?Run ./start.sh}@recommendation-pgvector:5432/recommendation_db?serverVersion=16&charset=utf8
  REDIS_URL: redis://:${REDIS_PASSWORD:?Run ./start.sh}@recommendation-redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_CATALOG_TOPIC: catalog.events
  KAFKA_CONSUMER_GROUP: recommendation-service.catalog-events
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
  GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash}

x-recommendation-worker: &recommendation-worker
  <<: *php-service
  image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-recommendation:${IMAGE_TAG:-local}
  env_file:
    - path: ./recommendation-service/.env
      required: false
    - path: ./recommendation-service/.env.local
      required: false

services:
  php-base:
    profiles: ["php-base"]
    image: ecommerce-php-base:8.5
    build:
      context: ./infra/php
      dockerfile: Dockerfile

  # ==================== AUTH ====================
  auth-app:
    <<: *auth-worker
    build:
      context: ./auth-service
      dockerfile: ../infra/php/laravel.Dockerfile
      target: prod
      additional_contexts: *laravel-contexts
    environment:
      <<: [*auth-db-env, *jwt-verify-env]
      JWT_ACCESS_PRIVATE_KEY_PATH: /run/jwt/current.pem
      JWT_ACCESS_PUBLIC_KEY_PATH: /run/jwt/current.pub.pem
      JWT_ACCESS_KID: ${JWT_ACCESS_KID:-auth-1}
      JWT_JWKS_PATH: /run/jwt/jwks.json
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Run ./start.sh}
    volumes:
      - ./.secrets/jwt:/run/jwt:ro
    networks: [apps, auth-data]
    healthcheck: *fpm-healthcheck
    depends_on:
      auth-postgres: { condition: service_healthy }
      auth-redis: { condition: service_healthy }

  auth-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./auth-service/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, apps]
    healthcheck: *nginx-healthcheck
    depends_on:
      auth-app: { condition: service_healthy }

  auth-events:
    <<: *auth-worker
    command: ["php", "artisan", "queue:work", "database", "--queue=auth-events", "--tries=10", "--timeout=40", "--sleep=2"]
    environment:
      <<: [*auth-db-env, *kafka-env, *analytics-env]
    networks: [auth-data, broker]
    healthcheck: *artisan-healthcheck
    depends_on:
      auth-postgres: { condition: service_healthy }
      auth-redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      analytics-rabbitmq: { condition: service_healthy }

  auth-scheduler:
    <<: *auth-worker
    command: ["php", "artisan", "schedule:work"]
    environment: *auth-db-env
    networks: [auth-data]
    healthcheck: *artisan-healthcheck
    depends_on:
      auth-postgres: { condition: service_healthy }
      auth-redis: { condition: service_healthy }

  auth-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Run ./start.sh}
    volumes:
      - auth-pgsql:/var/lib/postgresql/data
    networks: [auth-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d auth_db -U auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-redis:
    <<: *redis-service
    volumes:
      - auth-redis:/data
    networks: [auth-data]

  # ==================== CATALOG ====================
  catalog-app:
    <<: *catalog-worker
    build:
      context: ./catalog-service
      dockerfile: ../infra/php/laravel.Dockerfile
      target: prod
      additional_contexts: *laravel-contexts
    environment:
      <<: [*catalog-env, *jwt-verify-env]
    volumes:
      - catalog-public:/var/www/html/public
    networks: [apps, catalog-data]
    healthcheck: *fpm-healthcheck
    depends_on:
      catalog-postgres: { condition: service_healthy }
      catalog-redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  catalog-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - catalog-public:/var/www/html/public:ro
      - ./catalog-service/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, apps]
    healthcheck: *nginx-healthcheck
    depends_on:
      catalog-app: { condition: service_healthy }

  catalog-order-consumer:
    <<: *catalog-worker
    command: ["php", "artisan", "catalog:consume-order-events"]
    environment:
      <<: [*catalog-env, *kafka-env]
    networks: [catalog-data, broker]
    healthcheck: *artisan-healthcheck
    depends_on:
      catalog-postgres: { condition: service_healthy }
      catalog-redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  catalog-stock-consumer:
    <<: *catalog-worker
    command: ["php", "artisan", "catalog:consume-stock-commands"]
    environment:
      <<: [*catalog-env, *kafka-env]
    networks: [catalog-data, broker]
    healthcheck: *artisan-healthcheck
    depends_on:
      catalog-postgres: { condition: service_healthy }
      catalog-redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  catalog-outbox-relay:
    <<: *catalog-worker
    command: ["php", "artisan", "catalog:relay-outbox"]
    environment:
      <<: [*catalog-env, *kafka-env]
    networks: [catalog-data, broker]
    healthcheck: *artisan-healthcheck
    depends_on:
      catalog-postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  catalog-scheduler:
    <<: *catalog-worker
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *catalog-env
      CATALOG_RESERVATION_TTL_MINUTES: ${CATALOG_RESERVATION_TTL_MINUTES:-45}
    networks: [catalog-data]
    healthcheck: *artisan-healthcheck
    depends_on:
      catalog-postgres: { condition: service_healthy }
      catalog-redis: { condition: service_healthy }

  catalog-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Run ./start.sh}
    volumes:
      - catalog-pgsql:/var/lib/postgresql/data
    networks: [catalog-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d catalog_db -U catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-redis:
    <<: *redis-service
    volumes:
      - catalog-redis:/data
    networks: [catalog-data]

  minio:
    build:
      context: ./catalog-service/docker/minio
      dockerfile: Dockerfile
    image: catalog-minio:local
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run ./start.sh}
    volumes:
      - catalog-minio:/data
    networks: [edge, catalog-data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    build:
      context: ./catalog-service/docker/minio
      dockerfile: Dockerfile.mc
    image: catalog-mc:local
    restart: 'no'
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run ./start.sh}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set myminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing myminio/catalog-images
        mc anonymous set download myminio/catalog-images
    networks: [catalog-data]

  # ==================== ORDER ====================
  order-app:
    <<: *order-worker
    build:
      context: ./order-service
      dockerfile: ../infra/php/laravel.Dockerfile
      target: prod
      additional_contexts: *laravel-contexts
    environment:
      <<: [*order-env, *jwt-verify-env]
    networks: [apps, order-data, egress]
    healthcheck: *fpm-healthcheck
    depends_on:
      order-postgres: { condition: service_healthy }
      order-redis: { condition: service_healthy }

  order-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./order-service/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, apps]
    healthcheck: *nginx-healthcheck
    depends_on:
      order-app: { condition: service_healthy }

  order-outbox-relay:
    <<: *order-worker
    command: ["php", "artisan", "order:relay-outbox"]
    environment:
      <<: [*order-env, *kafka-env, *analytics-env]
    networks: [order-data, broker]
    healthcheck: *artisan-healthcheck
    depends_on:
      order-postgres: { condition: service_healthy }
      order-redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      analytics-rabbitmq: { condition: service_healthy }

  order-catalog-consumer:
    <<: *order-worker
    command: ["php", "artisan", "order:consume-catalog-events"]
    environment:
      <<: [*order-env, *kafka-env]
    networks: [order-data, broker]
    healthcheck: *artisan-healthcheck
    depends_on:
      order-postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  order-inventory-consumer:
    <<: *order-worker
    command: ["php", "artisan", "order:consume-inventory-events"]
    environment:
      <<: [*order-env, *kafka-env]
    networks: [order-data, broker]
    healthcheck: *artisan-healthcheck
    depends_on:
      order-postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  order-payments:
    <<: *order-worker
    command: ["php", "artisan", "queue:work", "database", "--queue=payments", "--timeout=40", "--sleep=2"]
    environment: *order-env
    networks: [order-data, egress]
    healthcheck: *artisan-healthcheck
    depends_on:
      order-postgres: { condition: service_healthy }
      order-redis: { condition: service_healthy }

  order-scheduler:
    <<: *order-worker
    command: ["php", "artisan", "schedule:work"]
    environment: *order-env
    networks: [order-data, egress]
    healthcheck: *artisan-healthcheck
    depends_on:
      order-postgres: { condition: service_healthy }
      order-redis: { condition: service_healthy }

  order-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Run ./start.sh}
    volumes:
      - order-pgsql:/var/lib/postgresql/data
    networks: [order-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d order_db -U order"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-redis:
    <<: *redis-service
    volumes:
      - order-redis:/data
    networks: [order-data]

  stripe-cli:
    profiles: ["stripe"]
    image: stripe/stripe-cli:v1.27.0
    restart: unless-stopped
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command:
      - listen
      - --events
      - payment_intent.succeeded,payment_intent.payment_failed,refund.updated,refund.failed
      - --forward-to
      - http://order-nginx/webhooks/stripe
      - --print-secret
    depends_on:
      order-nginx: { condition: service_healthy }
    networks: [apps, egress]

  # ==================== SEARCH ====================
  search-app:
    <<: *search-worker
    build:
      context: ./search-service
      dockerfile: ../infra/php/laravel.Dockerfile
      target: prod
      additional_contexts: *laravel-contexts
    environment: *search-env
    networks: [apps, search-data]
    healthcheck: *fpm-healthcheck
    depends_on:
      elasticsearch: { condition: service_healthy }
      search-redis: { condition: service_healthy }

  search-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./search-service/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, apps]
    healthcheck: *nginx-healthcheck
    depends_on:
      search-app: { condition: service_healthy }

  search-catalog-consumer:
    <<: *search-worker
    command: ["php", "artisan", "search:consume-catalog-events"]
    environment:
      <<: [*search-env, *kafka-env]
    networks: [search-data, broker]
    healthcheck: *artisan-healthcheck
    depends_on:
      elasticsearch: { condition: service_healthy }
      search-redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  search-events:
    <<: *search-worker
    command: ["php", "artisan", "queue:work", "redis", "--queue=search-events", "--tries=8", "--timeout=40", "--sleep=2"]
    environment:
      <<: [*search-env, *analytics-env]
    networks: [search-data, broker]
    healthcheck: *artisan-healthcheck
    depends_on:
      search-redis: { condition: service_healthy }
      analytics-rabbitmq: { condition: service_healthy }

  elasticsearch:
    image: elasticsearch:8.15.5
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - search-elasticsearch:/usr/share/elasticsearch/data
    networks: [search-data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  search-redis:
    <<: *redis-service
    volumes:
      - search-redis:/data
    networks: [search-data]

  # ==================== NOTIFICATION ====================
  notification-app:
    <<: *notification-worker
    build:
      context: ./notification-service
      dockerfile: ../infra/php/laravel.Dockerfile
      target: prod
      additional_contexts: *laravel-contexts
    environment:
      <<: [*notification-env, *jwt-verify-env]
    networks: [apps, notification-data, mail, egress]
    healthcheck: *fpm-healthcheck
    depends_on:
      mongodb: { condition: service_healthy }

  notification-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./notification-service/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, apps]
    healthcheck: *nginx-healthcheck
    depends_on:
      notification-app: { condition: service_healthy }

  notification-auth-consumer:
    <<: *notification-worker
    command: ["php", "artisan", "notification:consume-auth-events"]
    environment:
      <<: [*notification-env, *kafka-env]
    networks: [notification-data, broker, mail, egress]
    healthcheck: *artisan-healthcheck
    depends_on:
      mongodb: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  notification-order-consumer:
    <<: *notification-worker
    command: ["php", "artisan", "notification:consume-order-events"]
    environment:
      <<: [*notification-env, *kafka-env]
    networks: [notification-data, broker, mail, egress]
    healthcheck: *artisan-healthcheck
    depends_on:
      mongodb: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  notification-scheduler:
    <<: *notification-worker
    command: ["php", "artisan", "schedule:work"]
    environment: *notification-env
    networks: [notification-data]
    healthcheck: *artisan-healthcheck
    depends_on:
      mongodb: { condition: service_healthy }

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Run ./start.sh}
      MONGO_INITDB_DATABASE: notification_service
    volumes:
      - notification-mongodb:/data/db
    networks: [notification-data]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u root -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==================== RECOMMENDATION ====================
  recommendation-app:
    <<: *recommendation-worker
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
      target: prod
      additional_contexts: *laravel-contexts
    environment:
      <<: [*recommendation-env, *jwt-verify-env]
    networks: [apps, recommendation-data, egress]
    healthcheck: *fpm-healthcheck
    depends_on:
      recommendation-pgvector: { condition: service_healthy }
      recommendation-redis: { condition: service_healthy }

  recommendation-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./recommendation-service/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, apps]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/recommendations/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      recommendation-app: { condition: service_healthy }

  recommendation-worker:
    <<: *recommendation-worker
    profiles: ["gemini"]
    command: ["sh", "-c", "if [ -z \"$$GEMINI_API_KEY\" ]; then echo 'GEMINI_API_KEY is empty; consumer idle.'; exec sleep infinity; fi; exec php bin/console messenger:consume kafka_catalog --time-limit=3600 --memory-limit=256M -vv"]
    environment: *recommendation-env
    networks: [recommendation-data, broker, egress]
    healthcheck:
      test: ["CMD", "php", "bin/console", "about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      recommendation-pgvector: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  recommendation-scheduler:
    <<: *recommendation-worker
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "--time-limit=3600", "--memory-limit=256M"]
    environment: *recommendation-env
    networks: [recommendation-data]
    healthcheck:
      test: ["CMD", "php", "bin/console", "about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      recommendation-pgvector: { condition: service_healthy }

  recommendation-pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${RECOMMENDATION_DB_PASSWORD:?Run ./start.sh}
      POSTGRES_DB: recommendation_db
    volumes:
      - recommendation-pgvector:/var/lib/postgresql/data
      - ./recommendation-service/docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    networks: [recommendation-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d recommendation_db -U app_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  recommendation-redis:
    <<: *redis-service
    volumes:
      - recommendation-redis:/data
    networks: [recommendation-data]

  # ==================== ANALYTICS ====================
  analytics-back:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-analytics:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *jwt-verify-env
      ANALYTICS_HTTP_PORT: '8080'
      CLICKHOUSE_ADDR: analytics-clickhouse:9000
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run ./start.sh}
      RABBITMQ_URL: amqp://app:${RABBITMQ_PASSWORD:?Run ./start.sh}@analytics-rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-analytics.events}
    networks: [edge, apps, analytics-data, broker]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      analytics-clickhouse: { condition: service_healthy }
      analytics-rabbitmq: { condition: service_healthy }
      auth-nginx: { condition: service_healthy }

  analytics-clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run ./start.sh}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./analytics-service/docker/clickhouse/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./analytics-service/docker/clickhouse/02_replacing.sql:/docker-entrypoint-initdb.d/02_replacing.sql:ro
    networks: [analytics-data]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== BROKERS ====================
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [broker]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    restart: 'no'
    entrypoint: ['/bin/bash', '/init-topics.sh']
    volumes:
      - ./infra/kafka/init-topics.sh:/init-topics.sh:ro
    depends_on:
      kafka: { condition: service_healthy }
    networks: [broker]

  analytics-rabbitmq:
    image: rabbitmq:4.0-management-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/ensure-user.sh"]
    command: ["rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run ./start.sh}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/20-definitions.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ./infra/rabbitmq/ensure-user.sh:/ensure-user.sh:ro
    networks: [broker]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && test -f /tmp/rabbit-app-user-ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ==================== FRONTEND & GATEWAY ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/matveikurylovich-debug}/ecommerce-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      AUTH_INTERNAL_URL: http://auth-nginx
      NODE_ENV: production
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTPS_PORT:-443}:443"
      - "${GATEWAY_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO", "/dev/null", "https://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      frontend: { condition: service_healthy }
      auth-nginx: { condition: service_healthy }
      catalog-nginx: { condition: service_healthy }
      order-nginx: { condition: service_healthy }
      search-nginx: { condition: service_healthy }
      notification-nginx: { condition: service_healthy }
      recommendation-nginx: { condition: service_healthy }
      analytics-back: { condition: service_healthy }

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  egress:
    driver: bridge
  apps:
    driver: bridge
    internal: true
  broker:
    driver: bridge
    internal: true
  mail:
    driver: bridge
    internal: true
  auth-data:
    driver: bridge
    internal: true
  catalog-data:
    driver: bridge
    internal: true
  order-data:
    driver: bridge
    internal: true
  search-data:
    driver: bridge
    internal: true
  notification-data:
    driver: bridge
    internal: true
  recommendation-data:
    driver: bridge
    internal: true
  analytics-data:
    driver: bridge
    internal: true

volumes:
  auth-pgsql:
    name: shop_sail-pgsql
  auth-redis:
    name: shop_sail-redis
  catalog-pgsql: {}
  catalog-redis: {}
  catalog-minio: {}
  catalog-public: {}
  order-pgsql: {}
  order-redis: {}
  search-elasticsearch: {}
  search-redis: {}
  notification-mongodb:
    name: shop_sail-mongodb
  recommendation-pgvector: {}
  recommendation-redis: {}
  kafka-data:
    name: shop_sail-kafka
  clickhouse-data: {}
  rabbitmq-data: {}
