security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        jwt_users:
            memory:
                users: []

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        health:
            pattern: ^/(recommendations/)?health$
            stateless: true
            security: false
        api:
            pattern: ^/recommendations
            stateless: true
            provider: jwt_users
            custom_authenticators:
                - App\Security\JwtAccessTokenAuthenticator
        main:
            lazy: true
            provider: jwt_users

    access_control:
        - { path: ^/(recommendations/)?health$, roles: PUBLIC_ACCESS }
        - { path: ^/recommendations, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
