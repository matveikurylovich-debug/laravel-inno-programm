framework:
    messenger:
        transports:
            sync: 'sync://'
            kafka_catalog:
                dsn: 'kafka://%env(KAFKA_BROKERS)%'
                serializer: App\Serializer\CatalogEventSerializer
                options:
                    topic: '%env(KAFKA_CATALOG_TOPIC)%'
                    kafka_conf:
                        group.id: recommendation-service-consumer
                        auto.offset.reset: earliest

        routing:
            App\Message\CatalogEventMessage: kafka_catalog
