services:
    recommendation-app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: recommendation-service:local
        container_name: recommendation-app
        environment:
            DATABASE_URL: postgresql://app_user:secret@recommendation-pgvector:5432/recommendation_db?serverVersion=16&charset=utf8
            KAFKA_BROKERS: kafka:9092
            KAFKA_CATALOG_TOPIC: catalog.events
            KAFKA_CONSUMER_GROUP: recommendation-indexer-group
            GEMINI_API_KEY: placeholder
            GEMINI_TEXT_MODEL: gemini-2.5-flash
            GEMINI_EMBEDDING_MODEL: text-embedding-004
            SIMILARITY_THRESHOLD: "0.68"
        volumes:
            - .:/var/www/html
        networks:
            - recommendation
            - microservices-net
        depends_on:
            recommendation-pgvector:
                condition: service_healthy

    recommendation-pgvector:
        image: pgvector/pgvector:pg16
        container_name: recommendation-pgvector
        environment:
            POSTGRES_USER: app_user
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: recommendation_db
        volumes:
            - recommendation-pgvector:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
        networks:
            - recommendation
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -q -d recommendation_db -U app_user']
            interval: 5s
            timeout: 5s
            retries: 10

    recommendation-nginx:
        image: nginx:alpine
        container_name: recommendation-nginx
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/certs:/etc/nginx/certs:ro
        networks:
            - recommendation
            - microservices-net
        depends_on:
            - recommendation-app

networks:
    recommendation:
        driver: bridge
    microservices-net:
        external: true

volumes:
    recommendation-pgvector:
