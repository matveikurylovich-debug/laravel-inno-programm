limit_req_zone $binary_remote_addr zone=search_api:10m rate=5r/s;

map $host $hsts_value {
    hostnames;
    localhost "";
    127.0.0.1 "";
    default "max-age=31536000; includeSubDomains";
}

map $http_cookie $cookie_bearer {
    "~(?:^|;\s*)__Host-access=(?<tok>[^;]+)" "Bearer $tok";
    default "";
}

map $http_authorization $edge_authorization {
    ""      $cookie_bearer;
    default $http_authorization;
}

server {
    listen 80;
    server_tokens off;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_tokens off;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    proxy_read_timeout 60s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $edge_authorization;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security $hsts_value always;

    location = /health { proxy_pass http://auth-nginx/up; }
    location = /up/auth { proxy_pass http://auth-nginx/up; }
    location = /up/catalog { proxy_pass http://catalog-nginx/up; }
    location = /up/order { proxy_pass http://order-nginx/up; }
    location = /up/search { proxy_pass http://search-nginx/up; }
    location = /up/notification { proxy_pass http://notification-nginx/up; }

    location ~* ^/api/documentation { return 404; }

    location = /_auth/verify {
        internal;
        proxy_pass http://auth-nginx/api/v1/gateway/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $edge_authorization;
        proxy_set_header Accept application/json;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Browser-Session $http_x_browser_session;
    }

    location /api/auth/ { proxy_pass http://auth-nginx/api/v1/; }
    location /api/v1/ { proxy_pass http://auth-nginx; }
    location = /api/me { auth_request /_auth/verify; proxy_pass http://auth-nginx/api/v1/me; }
    location /api/profile { auth_request /_auth/verify; proxy_pass http://auth-nginx/api/v1/profile; }
    location /api/admin/ { auth_request /_auth/verify; proxy_pass http://auth-nginx/api/v1/admin/; }
    location = /api/logout { proxy_pass http://auth-nginx/api/v1/logout; }
    location = /api/logout-all { auth_request /_auth/verify; proxy_pass http://auth-nginx/api/v1/logout-all; }
    location /api/gateway/ { proxy_pass http://auth-nginx/api/v1/gateway/; }

    location = /api/search {
        limit_req zone=search_api burst=20 nodelay;
        proxy_pass http://search-nginx;
    }

    location /api/catalog/ {
        set $catalog_method $request_method;
        auth_request /_auth/catalog;
        proxy_pass http://catalog-nginx/api/;
    }

    location = /_auth/catalog {
        internal;
        if ($catalog_method = GET) { return 200; }
        if ($catalog_method = HEAD) { return 200; }
        proxy_pass http://auth-nginx/api/v1/gateway/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $edge_authorization;
        proxy_set_header Accept application/json;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Browser-Session $http_x_browser_session;
    }

    location /api/orders {
        auth_request /_auth/verify;
        proxy_pass http://order-nginx;
    }

    location = /api/recommendations/health {
        proxy_pass http://recommendation-nginx/recommendations/health;
    }

    location = /api/recommendations/chat {
        auth_request /_auth/verify;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_pass http://recommendation-nginx/recommendations/chat;
    }

    location /api/recommendations/ {
        auth_request /_auth/verify;
        proxy_pass http://recommendation-nginx/recommendations/;
    }

    location /api/notifications {
        auth_request /_auth/verify;
        proxy_pass http://notification-nginx/api/v1/notifications;
    }

    location /api/analytics/ {
        auth_request /_auth/verify;
        proxy_pass http://analytics-back:8080/analytics/;
    }

    location = /_auth/catalog-admin {
        internal;
        proxy_method GET;
        proxy_pass http://auth-nginx/api/v1/catalog-admin/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $edge_authorization;
    }
    location /catalog-admin {
        auth_request /_auth/catalog-admin;
        proxy_pass http://catalog-nginx;
    }
    location /livewire/ { proxy_pass http://catalog-nginx; }
    location /css/filament/ { proxy_pass http://catalog-nginx; }
    location /js/filament/ { proxy_pass http://catalog-nginx; }
    location /fonts/filament/ { proxy_pass http://catalog-nginx; }
    location /storage/ { proxy_pass http://catalog-nginx; }

    location /media/catalog-images/ {
        limit_except GET HEAD { deny all; }
        if ($uri ~ ^/media/catalog-images/?$) { return 403; }
        proxy_pass http://minio:9000/catalog-images/;
    }
    location /media/ { return 404; }

    location /webhooks/stripe { proxy_pass http://order-nginx; }
    location / { proxy_pass http://frontend:3000; }
}
