map $host $hsts_value {
    hostnames;
    localhost "";
    127.0.0.1 "";
    default "max-age=31536000; includeSubDomains";
}
server {
    listen 80;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_tokens off;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    proxy_read_timeout 200s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security $hsts_value always;
    location = /health { proxy_pass http://auth-nginx/up; }
    location = /up/auth { proxy_pass http://auth-nginx/up; }
    location = /up/catalog { proxy_pass https://catalog-nginx/up; proxy_ssl_verify off; }
    location = /up/order { proxy_pass https://order-nginx/up; proxy_ssl_verify off; }
    location = /up/search { proxy_pass https://search-nginx/up; proxy_ssl_verify off; }
    location = /up/notification { proxy_pass http://notification-app/up; }
    location /api/auth/ { proxy_pass http://auth-nginx/api/; }
    location /api/ { proxy_pass http://auth-nginx; }
    location = /_auth/catalog-admin {
        internal;
        proxy_method GET;
        proxy_pass http://auth-nginx/api/catalog-admin/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }
    location /catalog-admin {
        auth_request /_auth/catalog-admin;
        proxy_pass https://catalog-nginx;
    }
    location /livewire/ { proxy_pass https://catalog-nginx; }
    location /css/filament/ { proxy_pass https://catalog-nginx; }
    location /js/filament/ { proxy_pass https://catalog-nginx; }
    location /fonts/filament/ { proxy_pass https://catalog-nginx; }
    location /storage/ { proxy_pass https://catalog-nginx; }
    location ~* ^/api/documentation { return 404; }
    location /media/catalog-images/ {
        limit_except GET HEAD { deny all; }
        if ($uri ~ ^/media/catalog-images/?$) { return 403; }
        proxy_pass http://minio:9000/catalog-images/;
    }
    location /media/ { return 404; }
    location /webhooks/stripe { proxy_pass https://order-nginx; }
    location / { proxy_pass http://frontend:3000; }
}
