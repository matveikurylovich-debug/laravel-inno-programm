limit_req_zone $binary_remote_addr zone=search_api:10m rate=5r/s;

map $http_cookie $cookie_bearer {
    "~(?:^|;\s*)__Host-access=(?<tok>[^;]+)" "Bearer $tok";
    default "";
}

map $http_authorization $edge_authorization {
    ""      $cookie_bearer;
    default $http_authorization;
}

server {
    listen 80;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    proxy_read_timeout 60s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $edge_authorization;

    location = /health { proxy_pass http://auth-nginx/up; }
    location = /up/auth { proxy_pass http://auth-nginx/up; }
    location = /up/catalog { proxy_pass https://catalog-nginx/up; proxy_ssl_verify off; }
    location = /up/order { proxy_pass https://order-nginx/up; proxy_ssl_verify off; }
    location = /up/search { proxy_pass https://search-nginx/up; proxy_ssl_verify off; }
    location = /up/notification { proxy_pass http://notification-app/up; }

    location = /_auth/verify {
        internal;
        proxy_pass http://auth-nginx/api/gateway/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $edge_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Browser-Session $http_x_browser_session;
    }

    location /api/auth/ { proxy_pass http://auth-nginx/api/; }
    location /api/me { auth_request /_auth/verify; proxy_pass http://auth-nginx; }
    location /api/profile { auth_request /_auth/verify; proxy_pass http://auth-nginx; }
    location /api/admin/ { auth_request /_auth/verify; proxy_pass http://auth-nginx; }
    location /api/logout { auth_request /_auth/verify; proxy_pass http://auth-nginx; }
    location /api/logout-all { auth_request /_auth/verify; proxy_pass http://auth-nginx; }
    location /api/gateway/ { proxy_pass http://auth-nginx; }

    location = /api/search {
        limit_req zone=search_api burst=20 nodelay;
        proxy_pass https://search-nginx;
        proxy_ssl_verify off;
    }

    location /api/catalog/ {
        limit_except GET HEAD {
            auth_request /_auth/verify;
        }
        proxy_pass https://catalog-nginx/api/;
        proxy_ssl_verify off;
    }

    location /api/orders {
        auth_request /_auth/verify;
        proxy_pass https://order-nginx;
        proxy_ssl_verify off;
    }

    location = /api/recommendations/health {
        proxy_pass https://recommendation-nginx/recommendations/health;
        proxy_ssl_verify off;
    }

    location = /api/recommendations/chat {
        auth_request /_auth/verify;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_pass https://recommendation-nginx/recommendations/chat;
        proxy_ssl_verify off;
    }

    location /api/recommendations/ {
        auth_request /_auth/verify;
        proxy_pass https://recommendation-nginx/recommendations/;
        proxy_ssl_verify off;
    }

    location /api/notifications/ {
        auth_request /_auth/verify;
        proxy_pass http://notification-app;
    }

    location /api/analytics/ {
        auth_request /_auth/verify;
        proxy_pass http://analytics-back:8080/analytics/;
    }

    location = /_auth/catalog-admin {
        internal;
        proxy_method GET;
        proxy_pass http://auth-nginx/api/catalog-admin/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $edge_authorization;
    }
    location /catalog-admin {
        auth_request /_auth/catalog-admin;
        proxy_pass https://catalog-nginx;
        proxy_ssl_verify off;
    }
    location /livewire/ { proxy_pass https://catalog-nginx; proxy_ssl_verify off; }
    location /css/filament/ { proxy_pass https://catalog-nginx; proxy_ssl_verify off; }
    location /js/filament/ { proxy_pass https://catalog-nginx; proxy_ssl_verify off; }
    location /fonts/filament/ { proxy_pass https://catalog-nginx; proxy_ssl_verify off; }
    location /storage/ { proxy_pass https://catalog-nginx; proxy_ssl_verify off; }
    location /media/ { proxy_pass http://minio:9000/; }
    location /webhooks/stripe { proxy_pass https://order-nginx; proxy_ssl_verify off; }
    location / { proxy_pass http://frontend:3000; }
}
